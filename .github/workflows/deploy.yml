name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Add .nojekyll file
        run: touch out/.nojekyll

      - name: Copy 404 page for SPA routing
        run: |
          # The 404.html from public/ should already be in out/
          # But ensure it exists
          if [ ! -f out/404.html ]; then
            echo "Warning: 404.html not found in out directory"
            if [ -f out/not-found.html ]; then
              cp out/not-found.html out/404.html
            fi
          fi
          # Verify 404.html exists
          if [ -f out/404.html ]; then
            echo "✓ 404.html is ready for SPA routing"
          else
            echo "✗ Error: 404.html not found"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
