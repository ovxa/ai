<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // GitHub Pages SPA redirect hack
    // This script takes the current URL and converts the path into a query string
    // parameter for the root index.html page, which can then handle the routing

    (function() {
      var basePath = '/ai';
      var redirectPath = window.location.pathname;

      // If we're already at the base path, redirect to index
      if (redirectPath === basePath || redirectPath === basePath + '/') {
        window.location.replace(basePath + '/index.html');
        return;
      }

      // Remove base path from redirect path
      if (redirectPath.startsWith(basePath)) {
        redirectPath = redirectPath.substring(basePath.length);
      }

      // Redirect to index.html with the path as a query parameter
      var query = window.location.search;
      var hash = window.location.hash;

      window.location.replace(
        basePath + '/index.html?redirect=' +
        encodeURIComponent(redirectPath) +
        query.replace(/^\?/, '&') +
        hash
      );
    })();
  </script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #0f172a;
      color: #e2e8f0;
    }
    .spinner {
      border: 4px solid rgba(226, 232, 240, 0.1);
      border-radius: 50%;
      border-top: 4px solid #3b82f6;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
</body>
</html>
